name: PR Review Deadline Notifications

on:
  schedule:
    - cron: "0 6 * * *"  # runs daily at 6:00 UTC
  workflow_dispatch:      # allows manual run

permissions:
  contents: read
  pull-requests: write

env:
  DAYS_BEFORE_DEADLINE: 2   # number of days before the due date to trigger a reminder

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Get all open PRs
        id: prs
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            return prs.data;

      - name: Process PR deadlines
        uses: actions/github-script@v7
        with:
          script: |
            const prs = ${{ steps.prs.outputs.result }};
            const daysBefore = parseInt(process.env.DAYS_BEFORE_DEADLINE);

            for (const pr of prs) {
              // Read due date from the milestone
              const dueDate = pr.milestone?.due_on;
              if (!dueDate) continue;

              const deadline = new Date(dueDate);
              const today = new Date();
              const diffDays = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));

              // Skip if overdue or too far from the deadline
              if (diffDays <= daysBefore && diffDays >= 0) {
                const reviewers = [...(pr.requested_reviewers || [])].map(r => r.login);
                const reviewersList = reviewers.length ? reviewers.join(", ") : "reviewers";

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `⏰ **Reminder:** This pull request is due in **${diffDays} day(s)**.\n@${reviewersList} please complete your review before the deadline.`
                });
              }
            }
