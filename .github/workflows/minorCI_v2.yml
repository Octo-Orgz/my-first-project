# --- Node.js Dependency Caching ---
- name: Cache Node Dependencies (~/.npm)
  uses: actions/cache@v4 # Using the latest recommended version
  with:
    # 1. Path to the global npm cache directory
    path: ~/.npm
    # 2. Key based on OS, Node version, and the package definition file
    key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
    # 3. Restore key for finding partial or older matches
    restore-keys: |
      ${{ runner.os }}-node-${{ matrix.node-version }}-
      ${{ runner.os }}-node-

# NOTE: Since you are caching the global cache (~/.npm), you might not need a separate 
# step for `node_modules` unless your setup requires it.
# You would then run `npm install` after this step.


# --- Python Dependency Caching ---
- name: Cache Python Dependencies (~/.cache/pip)
  uses: actions/cache@v4 # Using the latest recommended version
  with:
    # 1. Path to the default pip cache directory
    path: ~/.cache/pip
    # 2. Key based on OS, Python version, and the requirements file
    key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
    # 3. Restore key for finding partial or older matches
    restore-keys: |
      ${{ runner.os }}-pip-${{ matrix.python-version }}-
      ${{ runner.os }}-pip-

# You would then run `pip install -r requirements.txt` after this step.
